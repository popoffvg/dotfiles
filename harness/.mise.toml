[tools]
node = "24.7.0"
watchexec = "latest"

[tasks."plugins:sync"]
description = "Deploy Rulesync plugin components into the home harness directories"
run = "python3 {{config_root}}/rulesync/deploy.py"

[tasks.stow]
description = "Deploy Claude, Codex and Pi through Rulesync"
depends = ["plugins:sync"]

[tasks."claude:sync"]
description = "Deploy the harness through Rulesync"
depends = ["plugins:sync"]

[tasks."claude:watch"]
description = "Regenerate the installed harness when source changes"
run = "watchexec --watch {{config_root}}/claude --watch {{config_root}}/plugins --watch {{config_root}}/rulesync -- python3 {{config_root}}/rulesync/deploy.py"
