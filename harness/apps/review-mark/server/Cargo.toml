[package]
name = "review-mark-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "review-mark-lsp"
path = "src/main.rs"

[lib]
name = "review_mark"
path = "src/lib.rs"

[dependencies]
line-comment-server = { path = "../../line-comment/server" }
lsp-server = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "3"
