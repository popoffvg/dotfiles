[workspace]
members = ["server"]
resolver = "2"

# The Zed extension sits at the root, so `zed: install dev extension` on this folder finds
# extension.toml beside the crate it compiles.
[package]
name = "wm-lsp-extension"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7"
