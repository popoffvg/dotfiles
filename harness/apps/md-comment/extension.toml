id = "md-comment"
name = "Line Comment"
version = "0.1.0"
schema_version = 1
description = "Review comments on lines of any file, kept outside the file"
repository = "https://github.com/popoffvg/dotfiles"
authors = ["Vitalii Popov"]

[lib]
kind = "Rust"

[language_servers.md-comment-language-server]
name = "Line Comment Language Server"
# Generated by harness/scripts/sync-md-comment-languages.py — Zed has no wildcard, so the
# server attaches only to the names listed here. Re-run after installing a language extension.
languages = [
  "C",
  "C++",
  "CSS",
  "Diff",
  "Elisp",
  "Gherkin",
  "Git Attributes",
  "Git Commit",
  "Git Config",
  "Git Ignore",
  "Git Rebase",
  "Go",
  "Go Mod",
  "Go Work",
  "HCL",
  "HTML",
  "JavaScript",
  "JSON",
  "JSONC",
  "Markdown",
  "Proto",
  "Python",
  "Python constraints",
  "Python requirements",
  "Rust",
  "Shell Script",
  "Tengo",
  "Terraform",
  "Terraform Vars",
  "Todotxt",
  "TOML",
  "TSX",
  "TypeScript",
  "YAML",
]
