id = "pr-comments"
name = "PR Comments"
version = "0.1.0"
schema_version = 1
description = "GitHub PR review comments on the lines they target"
repository = "https://github.com/popoffvg/dotfiles"
authors = ["Vitalii Popov"]

[lib]
kind = "Rust"

[language_servers.pr-comments-language-server]
name = "PR Comments Language Server"
# Generated by harness/scripts/sync-zed-languages.py --app pr-comments — Zed has no wildcard, so the
# server attaches only to the names listed here. Re-run after installing a language extension.
languages = [
  "C",
  "C++",
  "CSS",
  "Diff",
  "Docker Compose",
  "Dockerfile",
  "Elisp",
  "Gherkin",
  "Git Attributes",
  "Git Commit",
  "Git Config",
  "Git Ignore",
  "Git Rebase",
  "Go",
  "Go Mod",
  "Go Work",
  "HCL",
  "Helm",
  "HTML",
  "JavaScript",
  "JSON",
  "JSONC",
  "Markdown",
  "Mermaid",
  "Proto",
  "Python",
  "Python constraints",
  "Python requirements",
  "Quint",
  "Rust",
  "Shell Script",
  "Tengo",
  "Terraform",
  "Terraform Vars",
  "Todotxt",
  "TOML",
  "Tree",
  "TSX",
  "TypeScript",
  "Vue.js",
  "YAML",
]
