#:schema https://yazi-rs.github.io/schemas/yazi.json

[opener]
# block = true: mdterm is a full-screen TUI, it needs yazi to release the terminal.
mdterm = [
	{ run = 'mdterm %s', desc = "mdterm", block = true, for = "unix" },
]

[open]
# prepend: must win over the built-in `text/*` -> edit rule.
prepend_rules = [
	{ url = "*.{md,markdown}", use = [ "mdterm", "edit", "reveal" ] },
]

[plugin]
# Same renderer in the preview pane as the opener, via piper (`ya pkg` dep).
# piper runs the command under `sh -c` and gives it $1 = file path, $w/$h = pane
# size, $t = light|dark from the terminal. mdterm sees a pipe instead of a tty,
# so it prints the ANSI body once and exits instead of starting its TUI.
prepend_previewers = [
	{ url = "*.{md,markdown}", run = 'piper -- mdterm -T "$t" -w "$w" "$1"' },
]
