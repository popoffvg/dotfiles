[env]
GIT_SSH_COMMAND = "ssh -i ~/.ssh/id_ed25519"
FIRECRAWL_API_KEY = "fc-6369ed54b3374805af4b30196cd98c83"

[tools]
node = "24.7.0"
neovim = "latest"
go = "1.25.9"

[tasks.openrouter-env]
description = "Print export command for OPENROUTER_API_KEY from macOS Keychain"
run = "echo \"export OPENROUTER_API_KEY=$(security find-generic-password -s OPENROUTER_API_KEY -w 2>/dev/null)\""

[tasks.openrouter-check]
description = "Check if OPENROUTER_API_KEY is available in current shell"
run = "[ -n \"$OPENROUTER_API_KEY\" ] && echo OPENROUTER_API_KEY=SET || echo OPENROUTER_API_KEY=NOT_SET"

[tasks.stow]
description = "Stow dotfiles and deploy Claude, Codex and Pi through Rulesync"
run = [
  "stow --target=$HOME --dir={{config_root}}/.. --restow {{ config_root | basename }}",
  "stow --no-folding --target=$HOME/.cursor --dir={{config_root}}/harness --restow cursor",
  "stow --dotfiles --target=$HOME --dir={{config_root}} --restow zsh",
  "stow --dotfiles --target=$HOME --dir={{config_root}} --restow git",
  "python3 {{config_root}}/harness/rulesync/deploy.py",
]

[tasks.unstow]
description = "Unstow ordinary dotfiles; Rulesync installations remain managed separately"
run = [
  "stow --target=$HOME --dir={{config_root}}/.. --delete {{ config_root | basename }}",
  "stow --no-folding --target=$HOME/.cursor --dir={{config_root}}/harness --delete cursor",
  "stow --dotfiles --target=$HOME --dir={{config_root}} --delete zsh",
  "stow --dotfiles --target=$HOME --dir={{config_root}} --delete git",
]

[tasks."harness:self-improve:build"]
description = "Build the session-lesson scan TUI → ~/.local/bin/self-improve"
dir = "{{config_root}}/harness/apps/self-improve"
sources = ["harness/apps/self-improve/**/*.go", "harness/apps/self-improve/go.sum"]
outputs = ["{{env.HOME}}/.local/bin/self-improve"]
run = """
version=$(jq -r .version {{config_root}}/harness/plugins/self-improvement/.claude-plugin/plugin.json)
go build -ldflags "-X main.version=$version" -o $HOME/.local/bin/self-improve .
"""

[tasks."harness:self-improve:test"]
description = "Test the session-lesson scan TUI"
dir = "{{config_root}}/harness/apps/self-improve"
run = "go test ./... -count=1"

[tasks."harness:line-comment:build"]
description = "Build the line-comment language server → ~/.local/bin/line-comment-lsp"
dir = "{{config_root}}/harness/apps/line-comment"
sources = ["server/**/*.rs", "server/Cargo.toml"]
outputs = ["{{env.HOME}}/.local/bin/line-comment-lsp"]
run = """
cargo build --release -p line-comment-server
# install replaces through a temp file + rename. Copying onto the live binary
# invalidates its signature and macOS then SIGKILLs it.
install -m 755 target/release/line-comment-lsp $HOME/.local/bin/line-comment-lsp
"""

[tasks."harness:line-comment:test"]
description = "Test the line-comment language server"
dir = "{{config_root}}/harness/apps/line-comment"
run = "cargo test -p line-comment-server"

[tasks."harness:wm-lsp:build"]
description = "Build the wm notes language server and lint command → ~/.local/bin/wm-lsp"
dir = "{{config_root}}/harness/apps/wm-lsp"
sources = ["server/**/*.rs", "server/Cargo.toml", "{{config_root}}/harness/plugins/wm/schema/frontmatter.toml"]
outputs = ["{{env.HOME}}/.local/bin/wm-lsp"]
run = """
cargo build --release -p wm-lsp
# install replaces through a temp file + rename; macOS SIGKILLs a binary copied over in place.
install -m 755 target/release/wm-lsp $HOME/.local/bin/wm-lsp
"""

[tasks."harness:wm-lsp:test"]
description = "Test the wm notes language server"
dir = "{{config_root}}/harness/apps/wm-lsp"
run = "cargo test -p wm-lsp"

[tasks."harness:line-comment:languages"]
description = "Regenerate line-comment's extension.toml language list from the installed Zed languages"
run = "{{config_root}}/harness/scripts/sync-zed-languages.py --app line-comment"

[tasks."harness:pr-comments:build"]
description = "Build the pr-comments language server → ~/.local/bin/pr-comments-lsp"
dir = "{{config_root}}/harness/apps/pr-comments"
sources = ["server/**/*.rs", "server/Cargo.toml"]
outputs = ["{{env.HOME}}/.local/bin/pr-comments-lsp"]
run = """
cargo build --release -p pr-comments-server
install -m 755 target/release/pr-comments-lsp $HOME/.local/bin/pr-comments-lsp
"""

[tasks."harness:pr-comments:test"]
description = "Test the pr-comments language server"
dir = "{{config_root}}/harness/apps/pr-comments"
run = "cargo test -p pr-comments-server"

[tasks."harness:pr-comments:languages"]
description = "Regenerate pr-comments' extension.toml language list from the installed Zed languages"
run = "{{config_root}}/harness/scripts/sync-zed-languages.py --app pr-comments"

[tasks."harness:sync"]
description = "Generate and install the harness into ~/.claude, ~/.codex and ~/.pi/agent"
run = "python3 {{config_root}}/harness/rulesync/deploy.py"

[tasks."harness:check"]
description = "Compare installed harness files with Rulesync output"
run = "python3 {{config_root}}/harness/rulesync/deploy.py --check"

[tasks."harness:test"]
description = "Test deployment ownership and runtime maintenance guards"
run = "python3 -m unittest discover -s {{config_root}}/harness/rulesync/tests -v"

[tasks."harness:plugins:sync"]
description = "Deploy plugin components and marketplaces outside the source repository"
depends = ["harness:sync"]

[tasks."harness:codex:wm"]
description = "Deploy WM with the three public Codex aliases"
depends = ["harness:sync"]

[tasks."harness:amp:publish-skills"]
description = "Publish named skills to your personal Amp Skills repository"
run = 'bash "{{config_root}}/harness/scripts/publish-amp-skills.sh"'

[settings]
env_shell_expand = true
